name: Build CardboardXR Unity iOS App (IPA)

on:
  workflow_dispatch:

jobs:
  export-xcode:
    name: Export Unity 6 iOS Xcode Project
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity Credentials
        env:
          U_EMAIL: ${{ secrets.UNITY_EMAIL }}
          U_PASS: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$U_EMAIL" ] || [ -z "$U_PASS" ]; then
            echo "::error::Missing UNITY_EMAIL or UNITY_PASSWORD secret in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Unity Library Cache
        uses: actions/cache@v4
        with:
          path: BUISINESS/CardboardXR/CardboardXR-main/Library
          key: cardboardxr-ios-Library-${{ hashFiles('BUISINESS/CardboardXR/CardboardXR-main/Assets/**', 'BUISINESS/CardboardXR/CardboardXR-main/Packages/**', 'BUISINESS/CardboardXR/CardboardXR-main/ProjectSettings/**') }}
          restore-keys: |
            cardboardxr-ios-Library-

      - name: Export iOS Xcode Project via Unity 6000.6.8f1 Entitlement Auth
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/unity_home"
          docker run --rm \
            --workdir /github/workspace \
            --shm-size=1025m \
            --env UNITY_EMAIL \
            --env UNITY_PASSWORD \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --volume "$RUNNER_TEMP/unity_home:/root" \
            unityci/editor:ubuntu-6000.6.8f1-ios-3 \
            /bin/bash -c '
              dbus-uuidgen > /etc/machine-id || true
              mkdir -p /var/lib/dbus /root/.cache/unity3d /root/.local/share/unity3d/Unity /root/.config/unity3d/Unity/licenses
              ln -sf /etc/machine-id /var/lib/dbus/machine-id || true

              LIC_CLIENT="/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client"
              echo "== Activating Unity Personal Entitlement via Licensing Client =="
              if ! "$LIC_CLIENT" --activate-all --include-personal --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"; then
                echo "::warning::--activate-all exited non-zero; checking LicensingClient options..."
                "$LIC_CLIENT" --help || true
              fi
              "$LIC_CLIENT" --showEntitlements || true

              set +e
              unity-editor \
                -batchmode \
                -nographics \
                -quit \
                -username "$UNITY_EMAIL" \
                -password "$UNITY_PASSWORD" \
                -projectPath /github/workspace/BUISINESS/CardboardXR/CardboardXR-main \
                -buildTarget iOS \
                -executeMethod ProjectBootstrap.StereoBuilder.BuildIos \
                -logFile /dev/stdout
              BUILD_RC=$?

              chmod -R a+rwX /github/workspace/BUISINESS/CardboardXR/CardboardXR-main/Builds /github/workspace/BUISINESS/CardboardXR/CardboardXR-main/Library 2>/dev/null || true
              exit $BUILD_RC
            '

      - name: Verify Xcode Project Output
        run: |
          ls -la BUISINESS/CardboardXR/CardboardXR-main/Builds/iOS
          test -d BUISINESS/CardboardXR/CardboardXR-main/Builds/iOS/Unity-iPhone.xcodeproj

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardboardXR_Xcode_iOS
          path: BUISINESS/CardboardXR/CardboardXR-main/Builds/iOS
          if-no-files-found: error
          retention-days: 7

  package-ipa:
    name: Archive & Package Unsigned IPA (Sideloadly Ready)
    needs: export-xcode
    runs-on: macos-latest
    steps:
      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: CardboardXR_Xcode_iOS
          path: ios-xcode

      - name: Install CocoaPods Dependencies (if Podfile exists)
        working-directory: ios-xcode
        run: |
          if [ -f Podfile ]; then
            pod install
          fi

      - name: Build Unsigned iOS Archive (.xcarchive)
        working-directory: ios-xcode
        run: |
          if [ -d Unity-iPhone.xcworkspace ]; then
            xcodebuild archive \
              -workspace Unity-iPhone.xcworkspace \
              -scheme Unity-iPhone \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/CardboardXR.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild archive \
              -project Unity-iPhone.xcodeproj \
              -scheme Unity-iPhone \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/CardboardXR.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Package CardboardXR.ipa
        working-directory: ios-xcode
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/CardboardXR.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found inside xcarchive"
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r CardboardXR.ipa Payload
          ls -lh CardboardXR.ipa

      - name: Upload CardboardXR IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardboardXR_iOS_IPA
          path: ios-xcode/build/CardboardXR.ipa
          retention-days: 30
