  <script type="module">
    // =========================================================================
    // 1. 1€ (ONE EURO) FILTER & CRITICALLY DAMPED SPRING (Casiez et al. + Kowalski)
    // =========================================================================
    class ScalarOneEuroFilter {
      constructor(minCutoff = 1.35, beta = 0.015, dCutoff = 1.0) {
        this.minCutoff = minCutoff;
        this.beta = beta;
        this.dCutoff = dCutoff;
        this.xPrev = null;
        this.dxPrev = 0;
        this.tPrev = null;
      }
      reset() { this.xPrev = null; this.dxPrev = 0; this.tPrev = null; }
      alpha(dt, cutoff) {
        const tau = 1.0 / (2.0 * Math.PI * cutoff);
        return 1.0 / (1.0 + tau / Math.max(0.0001, dt));
      }
      filter(t, x) {
        if (this.tPrev === null || this.xPrev === null) {
          this.xPrev = x; this.tPrev = t; return x;
        }
        const dt = Math.max(0.001, t - this.tPrev);
        this.tPrev = t;
        const dx = (x - this.xPrev) / dt;
        const edx = this.dxPrev + this.alpha(dt, this.dCutoff) * (dx - this.dxPrev);
        this.dxPrev = edx;
        const cutoff = this.minCutoff + this.beta * Math.abs(edx);
        const out = this.xPrev + this.alpha(dt, cutoff) * (x - this.xPrev);
        this.xPrev = out;
        return out;
      }
    }

    class Point3DOneEuroFilter {
      constructor(minCutoff = 1.4, beta = 0.018, dCutoff = 1.0) {
        this.fx = new ScalarOneEuroFilter(minCutoff, beta, dCutoff);
        this.fy = new ScalarOneEuroFilter(minCutoff, beta, dCutoff);
        this.fz = new ScalarOneEuroFilter(minCutoff, beta, dCutoff);
      }
      reset() { this.fx.reset(); this.fy.reset(); this.fz.reset(); }
      filter(t, v) {
        return new THREE.Vector3(
          this.fx.filter(t, v.x),
          this.fy.filter(t, v.y),
          this.fz.filter(t, v.z)
        );
      }
    }

    // Emil Kowalski Spring Physics 3D (stiffness: 480, damping: 36, mass: 1)
    class Spring3D {
      constructor(stiffness = 480, damping = 36) {
        this.stiffness = stiffness;
        this.damping = damping;
        this.pos = new THREE.Vector3();
        this.vel = new THREE.Vector3();
        this.initialized = false;
      }
      snap(v) {
        this.pos.copy(v);
        this.vel.set(0, 0, 0);
        this.initialized = true;
      }
       step(target, dt) {
        if (!this.initialized) { this.snap(target); return this.pos; }
        const clampedDt = Math.min(dt, 0.033);
        const fx = (target.x - this.pos.x) * this.stiffness - this.vel.x * this.damping;
        const fy = (target.y - this.pos.y) * this.stiffness - this.vel.y * this.damping;
        const fz = (target.z - this.pos.z) * this.stiffness - this.vel.z * this.damping;
        this.vel.x += fx * clampedDt;
        this.vel.y += fy * clampedDt;
        this.vel.z += fz * clampedDt;
        this.pos.x += this.vel.x * clampedDt;
        this.pos.y += this.vel.y * clampedDt;
        this.pos.z += this.vel.z * clampedDt;
        return this.pos;
      }
    }

    // =========================================================================
    // 2. CARDBOARDXR PINCH DETECTOR, AIM HISTORY & PALM GATE (HandTracker.cs)
    // =========================================================================
    class CardboardPinchDetector {
      constructor() {
        this.isPinched = false;
        this.pinchProgress = 0; // 0..1 tactile closing ring indicator
        this.openCount = 0;
        this.lastTrackedTime = 0;
        this.k_OpenResults = 2;
        this.k_PinchKeptSeconds = 0.28;
      }
      update(lms2d, worldLms, nowSec) {
        this.lastTrackedTime = nowSec;
        const d2 = (a, b) => Math.hypot(lms2d[a].x - lms2d[b].x, lms2d[a].y - lms2d[b].y);
        const pinchPx = d2(4, 8);
        const tipPad = 0.5 * (d2(7, 8) + d2(3, 4));
        const knuckleW = 0.5 * (d2(5, 9) + d2(9, 13));
        const palmSpan = Math.max(knuckleW * 3.1, d2(0, 9), tipPad * 3.4, 24.0);

        const padRatio = pinchPx / Math.max(8.0, tipPad);
        const palmRatio = pinchPx / palmSpan;
        this.pinchProgress = Math.max(0, Math.min(1, 1.0 - (padRatio - 1.05) / 0.65));

        let worldPinchM = null;
        if (worldLms && worldLms.length >= 21) {
          const d3 = (a, b) => Math.hypot(
            worldLms[a].x - worldLms[b].x,
            worldLms[a].y - worldLms[b].y,
            worldLms[a].z - worldLms[b].z
          );
          const pairs = [[0,5],[0,9],[0,13],[0,17],[5,9],[5,13],[5,17],[9,13],[9,17],[13,17]];
          let sum = 0;
          for (const [i, j] of pairs) sum += d3(i, j);
          const rawPalm = sum / 10.0;
          if (rawPalm > 0.01) {
            const scale = 0.055 / rawPalm;
            worldPinchM = d3(4, 8) * scale;
          }
        }

        if (!this.isPinched) {
          // Ergonomic trigger works reliably in front & side hand views
          const close2d = (padRatio < 1.32) || (palmRatio < 0.34);
          const close3d = (worldPinchM === null) || (worldPinchM < 0.036);
          if (close2d && (close3d || padRatio < 1.05)) {
            this.isPinched = true;
            this.openCount = 0;
          }
        } else {
          const open2d = (padRatio > 1.56) && (palmRatio > 0.40);
          const open3d = (worldPinchM !== null) && (worldPinchM > 0.045);
          if (open2d || (open3d && padRatio > 1.34)) {
            this.openCount++;
            if (this.openCount >= this.k_OpenResults) {
              this.isPinched = false;
              this.openCount = 0;
            }
          } else {
            this.openCount = 0;
          }
        }
        if (this.isPinched) this.pinchProgress = 1.0;
        return this.isPinched;
      }
      holdOnHandLost(nowSec) {
        if (this.isPinched && (nowSec - this.lastTrackedTime) <= this.k_PinchKeptSeconds) {
          return true;
        }
        this.isPinched = false;
        this.openCount = 0;
        this.pinchProgress = 0;
        return false;
      }
    }

    class AimHistory {
      constructor(lookbackSec = 0.045) {
        this.lookbackSec = lookbackSec;
        this.samples = [];
      }
      record(pt, t) {
        this.samples.push({ x: pt.x, y: pt.y, t });
        while (this.samples.length > 24) this.samples.shift();
      }
      sample(t) {
        if (this.samples.length === 0) return null;
        const targetT = t - this.lookbackSec;
        for (let i = this.samples.length - 1; i >= 0; i--) {
          if (this.samples[i].t <= targetT) return this.samples[i];
        }
        return this.samples[0];
      }
      clear() { this.samples.length = 0; }
    }

    // =========================================================================
    // 3. MULTI-ZONE DESK 6DoF VISUAL TRACKER (Hand & Monitor Masked + Slerp)
    // =========================================================================
    class SmoothSpatialTracker6DoF {
      constructor() {
        this.w = 160;
        this.h = 90;
        this.canvas = document.createElement("canvas");
        this.canvas.width = this.w;
        this.canvas.height = this.h;
        this.ctx = this.canvas.getContext("2d", { willReadFrequently: true });

        this.prevGray = null;
        this.refGray = null;
        this.refYaw = 0;
        this.refPitch = 0;
        this.needsRef = true;

        this.targetYaw = 0;
        this.targetPitch = 0;
        this.targetRoll = 0;
        this.smoothYaw = 0;
        this.smoothPitch = 0;
        this.smoothRoll = 0;

        this.handHoldFrames = 0;
        this.lastHandBox = null;
        this.hasHardwarePose = false;
        this.hwPos = new THREE.Vector3();
        this.hwQuat = new THREE.Quaternion();
        this.originPos = new THREE.Vector3();
        this.originQuatInv = new THREE.Quaternion();
        this.poseBuffer = [];
        this.poseDelayMs = 10.0; // Khop do tre H.264 passthrough trong che do 1-SCR
        this.predictHorizonMs = 14.0; // Ngoai suy tuong lai (xrLocateViews) trong che do SBS VR
        this.vFovDeg = null;
        this.firstHardwareAnchored = false;
        this.linVel = new THREE.Vector3();
        this.angAxis = new THREE.Vector3(0, 1, 0);
        this.angSpeed = 0;
        this.lastPoseTimeMs = 0;
      }

      reset() {
        this.prevGray = null;
        this.refGray = null;
        this.needsRef = true;
        this.targetYaw = 0; this.targetPitch = 0; this.targetRoll = 0;
        this.smoothYaw = 0; this.smoothPitch = 0; this.smoothRoll = 0;
        this.originPos.copy(this.hwPos);
        this.originQuatInv.copy(this.hwQuat).invert();
      }

      requestAnchorRefresh() {
        this.needsRef = true;
      }

      setHardwarePose(px, py, pz, qx, qy, qz, qw, vFovDeg = null) {
        const now = performance.now();
        this.hasHardwarePose = true;
        const newPos = new THREE.Vector3(px, py, -pz);
        const newQuat = new THREE.Quaternion(-qx, -qy, qz, qw).normalize();

        if (this.lastPoseTimeMs > 0) {
          const dtSec = Math.max(0.002, Math.min(0.06, (now - this.lastPoseTimeMs) * 0.001));
          const instVel = newPos.clone().sub(this.hwPos).divideScalar(dtSec);
          this.linVel.lerp(instVel, 0.35);

          // Quaternion delta qDelta = newQuat * inv(hwQuat)
          const qDelta = newQuat.clone().multiply(this.hwQuat.clone().invert()).normalize();
          if (qDelta.w < 0) { qDelta.x = -qDelta.x; qDelta.y = -qDelta.y; qDelta.z = -qDelta.z; qDelta.w = -qDelta.w; }
          const halfAng = Math.acos(Math.max(-1, Math.min(1, qDelta.w)));
          const s = Math.sin(halfAng);
          if (s > 1e-4) {
            const axis = new THREE.Vector3(qDelta.x / s, qDelta.y / s, qDelta.z / s).normalize();
            const spd = (2.0 * halfAng) / dtSec;
            this.angAxis.lerp(axis, 0.35).normalize();
            this.angSpeed = this.angSpeed * 0.65 + Math.min(8.0, spd) * 0.35;
          } else {
            this.angSpeed *= 0.6;
          }
        }
        this.lastPoseTimeMs = now;
        this.hwPos.copy(newPos);
        this.hwQuat.copy(newQuat);

        if (vFovDeg && vFovDeg > 20 && vFovDeg < 110) {
          this.vFovDeg = this.vFovDeg === null ? vFovDeg : (this.vFovDeg * 0.8 + vFovDeg * 0.2);
        }
        this.poseBuffer.push({
          t: now,
          pos: newPos,
          quat: newQuat
        });
        if (this.poseBuffer.length > 32) this.poseBuffer.shift();
      }

      updateFromVideo(videoSource, lms2d, origW, origH, dt) {
        if (this.hasHardwarePose) return;
        if (!videoSource) return;

        try {
          this.ctx.drawImage(videoSource, 0, 0, this.w, this.h);
        } catch {
          return;
        }
        const rgba = this.ctx.getImageData(0, 0, this.w, this.h).data;
        const gray = new Uint8Array(this.w * this.h);
        for (let i = 0, j = 0; i < rgba.length; i += 4, j++) {
          gray[j] = (rgba[i] * 77 + rgba[i + 1] * 150 + rgba[i + 2] * 29) >> 8;
        }

        // Build hand exclusion box (with 8-frame exit persistence)
        let hBox = null;
        if (lms2d && lms2d.length >= 21) {
          const sx = this.w / Math.max(1, origW);
          const sy = this.h / Math.max(1, origH);
          let minX = this.w, minY = this.h, maxX = 0;
          for (const p of lms2d) {
            const x = p.x * sx, y = p.y * sy;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
          }
          hBox = {
            x1: Math.max(0, Math.floor(minX - 18)),
            y1: Math.max(0, Math.floor(minY - 16)),
            x2: Math.min(this.w, Math.ceil(maxX + 18)),
            y2: this.h
          };
          this.lastHandBox = hBox;
          this.handHoldFrames = 8;
        } else if (this.lastHandBox && this.handHoldFrames > 0) {
          this.handHoldFrames--;
          hBox = this.lastHandBox;
        }

        const inHand = (x, y) => hBox && x >= hBox.x1 && x <= hBox.x2 && y >= hBox.y1 && y <= hBox.y2;

        // Track 12x12 high-gradient background blocks (excluding hand & over-exposed monitor regions)
        if (this.prevGray) {
          const shiftsX = [];
          const shiftsY = [];
          const step = 12;
          const search = 10;

          for (let by = 14; by < this.h - 18; by += step) {
            for (let bx = 14; bx < this.w - 18; bx += step) {
              if (inHand(bx, by) || inHand(bx + 8, by + 8)) continue;

              // Check gradient contrast & avoid saturated white monitor pixels (> 235)
              let sumGrad = 0, brightCount = 0;
              for (let dy = 0; dy < 8; dy += 2) {
                for (let dx = 0; dx < 8; dx += 2) {
                  const idx = (by + dy) * this.w + (bx + dx);
                  const val = this.prevGray[idx];
                  if (val > 232) brightCount++;
                  sumGrad += Math.abs(val - this.prevGray[idx + 1]) + Math.abs(val - this.prevGray[idx + this.w]);
                }
              }
              if (brightCount > 6 || sumGrad < 110) continue;

              // Block match in current gray
              let bestSad = 999999, bestDx = 0, bestDy = 0;
              for (let sy = -search; sy <= search; sy += 2) {
                for (let sx = -search; sx <= search; sx += 2) {
                  if (inHand(bx + sx, by + sy)) continue;
                  let sad = 0;
                  for (let py = 0; py < 8; py += 2) {
                    const r1 = (by + py) * this.w + bx;
                    const r2 = (by + sy + py) * this.w + (bx + sx);
                    sad += Math.abs(this.prevGray[r1] - gray[r2]) +
                           Math.abs(this.prevGray[r1 + 2] - gray[r2 + 2]) +
                           Math.abs(this.prevGray[r1 + 4] - gray[r2 + 4]) +
                           Math.abs(this.prevGray[r1 + 6] - gray[r2 + 6]);
                  }
                  if (sad < bestSad) {
                    bestSad = sad; bestDx = sx; bestDy = sy;
                  }
                }
              }
              // Sub-pixel refinement around (bestDx, bestDy)
              for (let sy = bestDy - 1; sy <= bestDy + 1; sy++) {
                for (let sx = bestDx - 1; sx <= bestDx + 1; sx++) {
                  let sad = 0;
                  for (let py = 0; py < 8; py += 2) {
                    const r1 = (by + py) * this.w + bx;
                    const r2 = (by + sy + py) * this.w + (bx + sx);
                    sad += Math.abs(this.prevGray[r1] - gray[r2]) +
                           Math.abs(this.prevGray[r1 + 2] - gray[r2 + 2]) +
                           Math.abs(this.prevGray[r1 + 4] - gray[r2 + 4]) +
                           Math.abs(this.prevGray[r1 + 6] - gray[r2 + 6]);
                  }
                  if (sad < bestSad) {
                    bestSad = sad; bestDx = sx; bestDy = sy;
                  }
                }
              }

              if (bestSad < 320) {
                shiftsX.push(bestDx);
                shiftsY.push(bestDy);
              }
            }
          }

          if (shiftsX.length >= 4) {
            shiftsX.sort((a, b) => a - b);
            shiftsY.sort((a, b) => a - b);
            const medDx = shiftsX[shiftsX.length >> 1];
            const medDy = shiftsY[shiftsY.length >> 1];
            const focalSlam = 125.0;
            if (Math.abs(medDx) > 0.2 || Math.abs(medDy) > 0.2) {
              this.targetYaw -= Math.atan2(medDx, focalSlam);
              this.targetPitch = Math.max(-1.35, Math.min(1.35, this.targetPitch + Math.atan2(medDy, focalSlam)));
            }
          }
        }

        this.prevGray = gray;

        // Smooth 120Hz exponential interpolation so camera rotation is 100% butter-smooth
        const blend = 1.0 - Math.exp(-dt * 28.0);
        this.smoothYaw += (this.targetYaw - this.smoothYaw) * blend;
        this.smoothPitch += (this.targetPitch - this.smoothPitch) * blend;
        this.smoothRoll += (this.targetRoll - this.smoothRoll) * blend;
      }

      applyToCamera(cam, predictiveMode = false) {
        if (this.hasHardwarePose) {
          if (this.vFovDeg && Math.abs(cam.fov - this.vFovDeg) > 0.15) {
            cam.fov = this.vFovDeg;
            cam.updateProjectionMatrix();
          }
          let samplePos = this.hwPos.clone();
          let sampleQuat = this.hwQuat.clone();
          if (predictiveMode) {
            // OpenXR xrLocateViews style pose prediction for VR headsets
            const hSec = this.predictHorizonMs * 0.001;
            samplePos.addScaledVector(this.linVel, hSec);
            if (this.angSpeed > 0.02) {
              const predDelta = new THREE.Quaternion().setFromAxisAngle(this.angAxis, this.angSpeed * hSec);
              sampleQuat.premultiply(predDelta).normalize();
            }
          } else if (this.poseBuffer.length >= 2) {
            const targetT = performance.now() - this.poseDelayMs;
            let chosenIdx = this.poseBuffer.length - 1;
            for (let i = this.poseBuffer.length - 1; i >= 1; i--) {
              if (this.poseBuffer[i - 1].t <= targetT) {
                chosenIdx = i;
                break;
              }
            }
            const b = this.poseBuffer[chosenIdx];
            const a = this.poseBuffer[Math.max(0, chosenIdx - 1)];
            const span = b.t - a.t;
            const alpha = span > 0.1 ? Math.max(0, Math.min(1, (targetT - a.t) / span)) : 1.0;
            samplePos = a.pos.clone().lerp(b.pos, alpha);
            sampleQuat = a.quat.clone().slerp(b.quat, alpha);
          }
          const relPos = samplePos.sub(this.originPos).applyQuaternion(this.originQuatInv);
          const relQuat = this.originQuatInv.clone().multiply(sampleQuat);
          cam.position.lerp(relPos, predictiveMode ? 0.96 : 0.85);
          cam.quaternion.slerp(relQuat, predictiveMode ? 0.96 : 0.85);
        } else {
          cam.position.set(0, 0, 0);
          // Three.js camera looks down -Z: yaw around Y, pitch around X
          const euler = new THREE.Euler(-this.smoothPitch, -this.smoothYaw, -this.smoothRoll, "YXZ");
          cam.quaternion.setFromEuler(euler);
        }
        cam.updateMatrixWorld();
      }
    }

    // =========================================================================
    // 4. THREE.JS 3D SCENE & ALL 7 CARDBOARDXR SPATIAL APPS (GPU SHADERS)
    // =========================================================================
    const W = 1280, H = 720;
    const compCanvas = document.getElementById("composite-canvas");
    const compCtx = compCanvas.getContext("2d", { alpha: false });

    // Offscreen WebGL2 Renderer for 3D Holograms & CardboardXR Meshes (with Stencil + ACES Filmic)
    const glCanvas = document.createElement("canvas");
    glCanvas.width = W;
    glCanvas.height = H;
    const renderer = new THREE.WebGLRenderer({
      canvas: glCanvas,
      alpha: true,
      antialias: true,
      stencil: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(W, H, false);
    renderer.setPixelRatio(1);
    renderer.autoClear = false;
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    // -------------------------------------------------------------------------
    // 4A. SINGLE-PASS VIDEO CAS SHARPENING + 48x48 VR OPTICS COMPOSITOR
    // -------------------------------------------------------------------------
    const videoCanvas = document.createElement("canvas");
    videoCanvas.width = W;
    videoCanvas.height = H;
    const videoCtx = videoCanvas.getContext("2d", { alpha: false });
    const videoBgTex = new THREE.CanvasTexture(videoCanvas);
    videoBgTex.minFilter = THREE.LinearFilter;
    videoBgTex.magFilter = THREE.LinearFilter;
    const bgScene = new THREE.Scene();
    const bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const bgMat = new THREE.ShaderMaterial({
      uniforms: {
        tVideo: { value: videoBgTex },
        uCrop: { value: new THREE.Vector4(0, 0, 1, 1) },
        uTexel: { value: new THREE.Vector2(1.0 / W, 1.0 / H) },
        uSharp: { value: 0.30 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tVideo;
        uniform vec4 uCrop;
        uniform vec2 uTexel;
        uniform float uSharp;
        varying vec2 vUv;
        void main() {
          vec2 p = vec2(uCrop.x + vUv.x * uCrop.z, uCrop.y + vUv.y * uCrop.w);
          vec3 c = texture2D(tVideo, p).rgb;
          vec3 n = texture2D(tVideo, p + vec2(0.0, uTexel.y)).rgb;
          vec3 s = texture2D(tVideo, p - vec2(0.0, uTexel.y)).rgb;
          vec3 e = texture2D(tVideo, p + vec2(uTexel.x, 0.0)).rgb;
          vec3 w = texture2D(tVideo, p - vec2(uTexel.x, 0.0)).rgb;
          vec3 avg = 0.25 * (n + s + e + w);
          vec3 mn = min(c, min(min(n, s), min(e, w)));
          vec3 mx = max(c, max(max(n, s), max(e, w)));
          float damp = clamp(1.0 - max(mx.g - mn.g, 0.05) * 2.4, 0.0, 1.0);
          vec3 sharp = clamp(c + (c - avg) * (uSharp * (0.65 + 0.55 * damp)), 0.0, 1.0);
          gl_FragColor = vec4(sharp, 1.0);
        }
      `,
      depthTest: false,
      depthWrite: false
    });
    bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat));

    // Pre-Calculated 48x48 Barrel Distortion + R/G/B Lateral Chromatic Aberration + Hidden Area Vignette
    function createEyeDistortionMesh(eyeIdx, gridN = 48) {
      const k1 = 0.22;
      const k2 = 0.14;
      const kR = -0.014;
      const kB = 0.018;
      const verts = [], uvR = [], uvG = [], uvB = [], locG = [], rads = [], indices = [];
      const uBase = eyeIdx === 0 ? 0.0 : 0.5;
      for (let iy = 0; iy <= gridN; iy++) {
        const v = iy / gridN;
        const dy = 2.0 * v - 1.0;
        for (let ix = 0; ix <= gridN; ix++) {
          const u = ix / gridN;
          const dx = 2.0 * u - 1.0;
          const r2 = dx * dx + dy * dy;
          const r = Math.sqrt(r2);
          const s = 1.0 + k1 * r2 + k2 * r2 * r2;
          const sR = s * (1.0 + kR * r2);
          const sG = s;
          const sB = s * (1.0 + kB * r2);

          const gx = 0.5 + 0.5 * dx * sG;
          const gy = 0.5 + 0.5 * dy * sG;
          verts.push((eyeIdx === 0 ? -1.0 : 0.0) + u, dy, 0);
          uvR.push(uBase + 0.5 * (0.5 + 0.5 * dx * sR), 0.5 + 0.5 * dy * sR);
          uvG.push(uBase + 0.5 * gx, gy);
          uvB.push(uBase + 0.5 * (0.5 + 0.5 * dx * sB), 0.5 + 0.5 * dy * sB);
          locG.push(gx, gy);
          rads.push(r);
        }
      }
      for (let iy = 0; iy < gridN; iy++) {
        for (let ix = 0; ix < gridN; ix++) {
          const a = iy * (gridN + 1) + ix;
          const b = a + 1;
          const c = a + (gridN + 1);
          const d = c + 1;
          indices.push(a, b, c, b, d, c);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute("aUvR", new THREE.Float32BufferAttribute(uvR, 2));
      geo.setAttribute("aUvG", new THREE.Float32BufferAttribute(uvG, 2));
      geo.setAttribute("aUvB", new THREE.Float32BufferAttribute(uvB, 2));
      geo.setAttribute("aLocG", new THREE.Float32BufferAttribute(locG, 2));
      geo.setAttribute("aRad", new THREE.Float32BufferAttribute(rads, 1));
      geo.setIndex(indices);

      const mat = new THREE.ShaderMaterial({
        uniforms: { tEye: { value: stereoTarget.texture } },
        vertexShader: `
          attribute vec2 aUvR;
          attribute vec2 aUvG;
          attribute vec2 aUvB;
          attribute vec2 aLocG;
          attribute float aRad;
          varying vec2 vUvR;
          varying vec2 vUvG;
          varying vec2 vUvB;
          varying vec2 vLocG;
          varying float vRad;
          void main() {
            vUvR = aUvR;
            vUvG = aUvG;
            vUvB = aUvB;
            vLocG = aLocG;
            vRad = aRad;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tEye;
          varying vec2 vUvR;
          varying vec2 vUvG;
          varying vec2 vUvB;
          varying vec2 vLocG;
          varying float vRad;
          void main() {
            float inside = step(0.0, vLocG.x) * step(vLocG.x, 1.0) * step(0.0, vLocG.y) * step(vLocG.y, 1.0);
            float vig = smoothstep(1.16, 1.02, vRad);
            float r = texture2D(tEye, vUvR).r;
            float g = texture2D(tEye, vUvG).g;
            float b = texture2D(tEye, vUvB).b;
            gl_FragColor = vec4(vec3(r, g, b) * inside * vig, 1.0);
          }
        `,
        depthTest: false,
        depthWrite: false
      });
      return new THREE.Mesh(geo, mat);
    }
    const vrOpticsScene = new THREE.Scene();

      addPoint(pt3) {
        if (this.curPts.length > 0) {
          const last = this.curPts[this.curPts.length - 1];
          const jump = pt3.distanceTo(last);
          if (jump > 0.14) {
            this.finishStroke();
          } else if (jump < 0.004) {
            return;
          }
        }
        this.curPts.push(pt3.clone());
        this.rebuildActiveStroke();
      },
      rebuildActiveStroke() {
        if (this.curPts.length < 2) return;
        if (this.curGroup) {
          appGroups[1].remove(this.curGroup);
          this.curGroup.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
        }
        const grp = new THREE.Group();
        const curve = new THREE.CatmullRomCurve3(this.curPts);
        const segs = Math.min(240, Math.max(10, this.curPts.length * 3));
        const radius = 0.0085;
        const col = paintColors[this.colorIdx];

          metalness: 0.15,

        });
        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, radius, 12, false), mat);
        const capGeo = new THREE.SphereGeometry(radius, 10, 10);
        const startCap = new THREE.Mesh(capGeo, mat);
        startCap.position.copy(this.curPts[0]);
        const endCap = new THREE.Mesh(capGeo, mat);
        endCap.position.copy(this.curPts[this.curPts.length - 1]);
        grp.add(tube, startCap, endCap);
        this.curGroup = grp;
        appGroups[1].add(this.curGroup);
      },

          appGroups[1].remove(this.curGroup);
          this.curGroup.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
        }
        this.curGroup = null;
        this.curPts = [];
      },
      undo() {
        const last = this.strokes.pop();
        if (last) {
          appGroups[1].remove(last);
          last.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
        }

      isHovered: false,
      isGrabbed: false,
      isFloating: true,
      wasPinched: false,
      grabDist: 0.58,
      grabStartPinchDist: 0.50,
      grabStartCubeDist: 0.58,
      grabOffset: new THREE.Vector3(),
      lastFingerAngle: null,
      laserLine: null,
      isOffscreen: false,
      offscreenDirX: 0,
      size: 0.11, // 11cm tactile palm-sized glass Tesseract cube
      deskY: -0.25,

      init() {
        const s = this.size;
        const half = s * 0.5;

        // 1. Smoked Translucent Crystal Shell (MeshPhysicalMaterial + Studio HDR reflections)
        const boxGeo = new THREE.BoxGeometry(s * 0.94, s * 0.94, s * 0.94);
        const boxMat = new THREE.MeshPhysicalMaterial({
          color: 0x0b1628,
          emissive: 0x0284c7,
          emissiveIntensity: 0.18,
          roughness: 0.08,
          metalness: 0.18,
          transparent: true,
          opacity: 0.36,
          clearcoat: 1.0,
          clearcoatRoughness: 0.06,
          envMapIntensity: 2.0,
          depthWrite: false
        });
        this.solidMesh = new THREE.Mesh(boxGeo, boxMat);
        this.group.add(this.solidMesh);

        // 2. 12 Volumetric Metallic Edge Struts + 8 Corner Nodes (always crisp, catches HDR highlights!)
        this.edgeMat = new THREE.MeshStandardMaterial({
          color: 0xe0f2fe,
          emissive: 0x00f3ff,
          emissiveIntensity: 0.85,
          roughness: 0.16,
          metalness: 0.88
        });
        const strutR = s * 0.036;
        const barXGeo = new THREE.CylinderGeometry(strutR, strutR, s, 8);
        barXGeo.rotateZ(Math.PI / 2);
        const barYGeo = new THREE.CylinderGeometry(strutR, strutR, s, 8);
        const barZGeo = new THREE.CylinderGeometry(strutR, strutR, s, 8);
        barZGeo.rotateX(Math.PI / 2);

        const signs = [-1, 1];
        for (const a of signs) {
          for (const b of signs) {
            const mx = new THREE.Mesh(barXGeo, this.edgeMat);
            mx.position.set(0, a * half, b * half);
            const my = new THREE.Mesh(barYGeo, this.edgeMat);
            my.position.set(a * half, 0, b * half);
            const mz = new THREE.Mesh(barZGeo, this.edgeMat);
            mz.position.set(a * half, b * half, 0);
            this.solidMesh.add(mx, my, mz);
          }
        }
        const cornerGeo = new THREE.SphereGeometry(s * 0.056, 12, 12);
        for (const sx of signs) {
          for (const sy of signs) {
            for (const sz of signs) {
              const cn = new THREE.Mesh(cornerGeo, this.edgeMat);
              cn.position.set(sx * half, sy * half, sz * half);
              this.solidMesh.add(cn);
            }
          }
        }

        // 3. Dual Spinning Holographic Gyro Rings + Plasma Reactor Core inside Glass Cube
        this.coreMesh = new THREE.Mesh(
          new THREE.IcosahedronGeometry(s * 0.22, 0),
          new THREE.MeshStandardMaterial({
            color: 0x38bdf8, emissive: 0x00f3ff, emissiveIntensity: 1.05, roughness: 0.15, metalness: 0.65
          })
        );
        this.solidMesh.add(this.coreMesh);

        this.gyroOuter = new THREE.Mesh(
          new THREE.TorusGeometry(s * 0.34, s * 0.016, 10, 40),
          new THREE.MeshStandardMaterial({
            color: 0xe2e8f0, emissive: 0x38bdf8, emissiveIntensity: 0.55, metalness: 0.9, roughness: 0.15
          })
        );
        this.gyroInner = new THREE.Mesh(
          new THREE.TorusGeometry(s * 0.27, s * 0.014, 10, 36),
          new THREE.MeshStandardMaterial({
            color: 0xfef08a, emissive: 0xf59e0b, emissiveIntensity: 0.6, metalness: 0.85, roughness: 0.18
          })
        );
        this.gyroOuter.rotation.x = Math.PI / 3;
        this.gyroInner.rotation.y = Math.PI / 4;
        this.solidMesh.add(this.gyroOuter, this.gyroInner);

        // 4. HandRayView Target Dot (dynamically faces viewer)
        this.targetDot = new THREE.Mesh(
          new THREE.SphereGeometry(0.008, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        this.targetDot.position.set(0, 0, s * 0.60);
        this.targetDot.visible = false;
        this.group.add(this.targetDot);

        // 5. Soft Grounded Contact Shadow + Hologram Anchor Ring on Real Desk Plane (independent of cube tilt!)
        const shCanvas = document.createElement("canvas");
        shCanvas.width = 128;
        shCanvas.height = 128;
        const shCtx = shCanvas.getContext("2d");
        const grad = shCtx.createRadialGradient(64, 64, 6, 64, 64, 62);
        grad.addColorStop(0, "rgba(0, 0, 0, 0.58)");
        grad.addColorStop(0.55, "rgba(0, 0, 0, 0.22)");
        grad.addColorStop(1, "rgba(0, 0, 0, 0)");
        shCtx.fillStyle = grad;
        shCtx.fillRect(0, 0, 128, 128);
        const shTex = new THREE.CanvasTexture(shCanvas);
        const shGeo = new THREE.PlaneGeometry(s * 2.6, s * 2.6);
        shGeo.rotateX(-Math.PI / 2);
        this.shadowPlane = new THREE.Mesh(
          shGeo,
          new THREE.MeshBasicMaterial({ map: shTex, transparent: true, opacity: 0.72, depthWrite: false })
        );
        appGroups[4].add(this.shadowPlane);

        const ringGeo = new THREE.RingGeometry(s * 0.52, s * 0.58, 48);
        ringGeo.rotateX(-Math.PI / 2);
        this.shadowRing = new THREE.Mesh(
          ringGeo,
          new THREE.MeshBasicMaterial({ color: 0x00f3ff, side: THREE.DoubleSide, transparent: true, opacity: 0.42, depthWrite: false })
        );
        appGroups[4].add(this.shadowRing);

        // 6. PinchAim Laser Ray from finger toward Cube (gives clear hover lock visual)
        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -0.5)]);
        this.laserLine = new THREE.Line(
          laserGeo,
          new THREE.LineBasicMaterial({ color: 0x6ee7b7, transparent: true, opacity: 0.55 })
        );
        this.laserLine.visible = false;
        appGroups[4].add(this.laserLine);

        this.springPos.snap(this.pos);
        this.group.position.copy(this.pos);
        appGroups[4].add(this.group);
      },

      resetToFront(cam) {
        const forward = new THREE.Vector3(0, -0.02, -0.58).applyQuaternion(cam.quaternion);
        this.pos.copy(cam.position).add(forward);
        this.deskY = this.pos.y - 0.22;
        this.vel.set(0, 0, 0);
        this.isFloating = true;
        this.isGrabbed = false;
        this.springPos.snap(this.pos);
        this.group.position.copy(this.pos);
      },

      update(dt, isPinched, pinchWorld3d, cam, fingerAngle, tracker6dof) {
        const eyeOrig = cam.position;
        let rayDir = null;
        if (pinchWorld3d) {
          rayDir = pinchWorld3d.clone().sub(eyeOrig).normalize();
        }

        // Check if Cube is offscreen relative to camera for directional badge hint
        const camSpace = this.pos.clone().applyMatrix4(cam.matrixWorldInverse);
        const ndc = this.pos.clone().project(cam);
        this.isOffscreen = (camSpace.z > -0.05) || (Math.abs(ndc.x) > 1.05) || (Math.abs(ndc.y) > 1.05);
        this.offscreenDirX = camSpace.x >= 0 ? 1 : -1;

        // 1. Generous Magnetic Eye-Through-PinchPoint Hover Cone (easy targeting!)
        this.isHovered = false;
        if (rayDir) {
          const toCube = this.pos.clone().sub(eyeOrig);
          const proj = toCube.dot(rayDir);
          if (proj > 0.10) {
            const closest = eyeOrig.clone().addScaledVector(rayDir, proj);
            const rayDist = closest.distanceTo(this.pos);
            if (rayDist < this.size * 2.15) this.isHovered = true;
          }
          if (pinchWorld3d.distanceTo(this.pos) < 0.28) this.isHovered = true;
        }

        const justReleased = (!isPinched) && this.wasPinched;
        this.wasPinched = isPinched;

        // 2. Grab on Pinch + Hover
        if (isPinched && !this.isGrabbed && this.isHovered && rayDir) {
          this.isGrabbed = true;
          this.isFloating = false;
          this.grabDist = Math.max(0.40, Math.min(1.15, this.pos.distanceTo(eyeOrig)));
          this.grabStartCubeDist = this.grabDist;
          this.grabStartPinchDist = pinchWorld3d ? pinchWorld3d.distanceTo(eyeOrig) : 0.50;
          const rayPt = eyeOrig.clone().addScaledVector(rayDir, this.grabDist);
          this.grabOffset.copy(this.pos).sub(rayPt);
          this.vel.set(0, 0, 0);
          this.lastFingerAngle = fingerAngle;
        }

        if (isPinched && this.isGrabbed && rayDir) {
          this.grabOffset.multiplyScalar(Math.exp(-dt * 15.0));
          // Smooth Z-axis push/pull relative to initial grab depth
          const curPinchDist = pinchWorld3d.distanceTo(eyeOrig);
          const depthShift = (curPinchDist - this.grabStartPinchDist) * 1.15;
          const targetDist = Math.max(0.36, Math.min(1.25, this.grabStartCubeDist + depthShift));
          this.grabDist += (targetDist - this.grabDist) * 0.25;

          const target = eyeOrig.clone().addScaledVector(rayDir, this.grabDist).add(this.grabOffset);
          const prevPos = this.pos.clone();
          this.pos.copy(this.springPos.step(target, dt));
          if (dt > 0.001) {
            const instVel = this.pos.clone().sub(prevPos).divideScalar(dt);
            this.vel.lerp(instVel, 0.45);
          }

          // Clean controlled rotation: twist fingers directly to spin without wild tumbling when moving XY!
          if (fingerAngle !== null && this.lastFingerAngle !== null) {
            let da = fingerAngle - this.lastFingerAngle;
            if (da > Math.PI) da -= Math.PI * 2;
            if (da < -Math.PI) da += Math.PI * 2;
            if (Math.abs(da) < 0.7) {
              const rotDelta = new THREE.Quaternion().setFromEuler(new THREE.Euler(da * 0.35, -da * 1.45, da * 0.30));
              this.targetQuat.premultiply(rotDelta);
            }
          }
          this.lastFingerAngle = fingerAngle;
        } else {
          this.lastFingerAngle = null;
          if (justReleased && this.isGrabbed) {
            this.isGrabbed = false;
            tracker6dof.requestAnchorRefresh();
            if (this.vel.length() < 1.35) {
              this.isFloating = true;
              this.vel.set(0, 0, 0);
            } else {
              this.isFloating = false;
            }
          }

          if (!this.isFloating) {
            this.vel.y -= 2.6 * dt;
            this.pos.addScaledVector(this.vel, dt);
            this.vel.multiplyScalar(0.95);
            if (this.pos.y < this.deskY + this.size * 0.5) {
              this.pos.y = this.deskY + this.size * 0.5;
              this.vel.y = -this.vel.y * 0.52;
              this.vel.x *= 0.84;
              this.vel.z *= 0.84;
              if (Math.abs(this.vel.y) < 0.12 && this.vel.length() < 0.18) {
                this.vel.set(0, 0, 0);
                this.isFloating = true;
              }
            }
            this.springPos.snap(this.pos);
          }
        }

        // Spin internal Tesseract reactor & gyro rings smoothly
        if (this.coreMesh) {
          this.coreMesh.rotation.y += dt * (this.isGrabbed ? 3.2 : 1.5);
          this.coreMesh.rotation.x += dt * 1.1;
        }
        if (this.gyroOuter) this.gyroOuter.rotation.z += dt * 1.8;
        if (this.gyroInner) this.gyroInner.rotation.x -= dt * 2.1;

        // Apply smooth quaternion slerp & position
        this.quat.slerp(this.targetQuat, 1.0 - Math.exp(-dt * 18.0));
        this.solidMesh.quaternion.copy(this.quat);
        this.group.position.copy(this.pos);

        // Project Soft Grounded Contact Shadow directly onto desk plane below cube
        const heightAboveDesk = Math.max(0.02, this.pos.y - this.deskY);
        const shScale = Math.max(0.65, Math.min(1.65, 0.85 + heightAboveDesk * 1.2));
        const shAlpha = Math.max(0.18, Math.min(0.75, 0.82 - heightAboveDesk * 1.4));
        if (this.shadowPlane) {
          this.shadowPlane.position.set(this.pos.x, this.deskY, this.pos.z);
          this.shadowPlane.scale.set(shScale, 1, shScale);
          this.shadowPlane.material.opacity = shAlpha;
        }
        if (this.shadowRing) {
          this.shadowRing.position.set(this.pos.x, this.deskY + 0.002, this.pos.z);
          this.shadowRing.material.opacity = shAlpha * 0.55;
        }
        if (this.laserLine) {
          if (!this.isGrabbed && this.isHovered && pinchWorld3d) {
            this.laserLine.visible = true;
            this.laserLine.geometry.setFromPoints([pinchWorld3d, this.pos]);
          } else {
            this.laserLine.visible = false;
          }
        }

        // HandRayView Target Dot dynamically faces viewer
        const toEye = eyeOrig.clone().sub(this.pos);
        if (toEye.lengthSq() > 1e-4) {
          toEye.normalize().multiplyScalar(this.size * 0.62);
          this.targetDot.position.copy(toEye);
        }

        // GrabCue Visual States across volumetric struts + translucent glass + core
        if (this.isGrabbed) {
          this.edgeMat.color.setHex(0xfef08a);
          this.edgeMat.emissive.setHex(0xf59e0b);
          this.solidMesh.material.emissive.setHex(0xd97706);
          this.targetDot.visible = true;
          this.targetDot.material.color.setHex(0xffd54f);
          this.shadowRing.material.color.setHex(0xffd54f);
        } else if (this.isHovered) {
          this.edgeMat.color.setHex(0xa7f3d0);
          this.edgeMat.emissive.setHex(0x10b981);
          this.solidMesh.material.emissive.setHex(0x059669);
          this.targetDot.visible = true;
          this.targetDot.material.color.setHex(0xffffff);
          this.shadowRing.material.color.setHex(0x6ee7b7);
        } else {
          this.edgeMat.color.setHex(0xe0f2fe);
          this.edgeMat.emissive.setHex(0x00f3ff);
          this.solidMesh.material.emissive.setHex(0x0284c7);
          this.targetDot.visible = false;
          this.shadowRing.material.color.setHex(0x00f3ff);
        }
      }
    };
    cubeState.init();

    // -------------------------------------------------------------------------
    // APP 5: 3D PRECISION CALIPER
    // -------------------------------------------------------------------------
    const caliperState = {
      line: null,
      jawA: null,
      jawB: null,
      distMm: 0
    };
    {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0.1, -0.8)]);
      caliperState.line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x00f3ff, linewidth: 3 }));
      const jawGeo = new THREE.SphereGeometry(0.009, 16, 16);
      const jawMat = new THREE.MeshStandardMaterial({ color: 0xffd54f, emissive: 0xffd54f, emissiveIntensity: 0.6 });
      caliperState.jawA = new THREE.Mesh(jawGeo, jawMat);
      caliperState.jawB = new THREE.Mesh(jawGeo, jawMat);
      appGroups[5].add(caliperState.line, caliperState.jawA, caliperState.jawB);
    }

    // -------------------------------------------------------------------------
    // APP 6: SPATIAL 3D SOLAR SYSTEM & HORIZON GRID
    // -------------------------------------------------------------------------
    const solarState = {
      root: new THREE.Group(),
      planets: [],
      speedMult: 1.0,
      showGrid: true,
      gridHelper: null
    };
    {
      solarState.root.position.set(0, -0.05, -1.25);
      solarState.root.rotation.x = 0.35;
      appGroups[6].add(solarState.root);

      solarState.gridHelper = new THREE.GridHelper(2.4, 16, 0x00f3ff, 0x1e293b);
      solarState.gridHelper.position.set(0, -0.38, -1.25);
      appGroups[6].add(solarState.gridHelper);

      // Sun Core + Internal PointLight
      const sunMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.085, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xf59e0b, emissiveIntensity: 1.15, roughness: 0.2 })
      );
      const sunLight = new THREE.PointLight(0xfde68a, 2.2, 4.0);
      solarState.root.add(sunMesh, sunLight);

      const defs = [
        { r: 0.24, speed: 1.5, sz: 0.024, col: 0x00f3ff, ring: false },
        { r: 0.42, speed: 0.85, sz: 0.036, col: 0x3b82f6, ring: false },
        { r: 0.64, speed: 0.48, sz: 0.044, col: 0xfde047, ring: true }
      ];
      for (const d of defs) {
        const orbitRing = new THREE.Mesh(
          new THREE.RingGeometry(d.r - 0.003, d.r + 0.003, 64),
          new THREE.MeshBasicMaterial({ color: 0x334155, side: THREE.DoubleSide })
        );
        orbitRing.rotation.x = Math.PI / 2;
        solarState.root.add(orbitRing);

        const pMesh = new THREE.Mesh(
          new THREE.SphereGeometry(d.sz, 24, 24),
          new THREE.MeshStandardMaterial({ color: d.col, roughness: 0.3, metalness: 0.2 })
        );
        if (d.ring) {
          const satRing = new THREE.Mesh(
            new THREE.RingGeometry(d.sz * 1.4, d.sz * 2.2, 32),
            new THREE.MeshBasicMaterial({ color: 0xfef08a, side: THREE.DoubleSide, transparent: true, opacity: 0.75 })
          );
          satRing.rotation.x = Math.PI / 2.4;
          pMesh.add(satRing);
        }
        solarState.root.add(pMesh);
        solarState.planets.push({ mesh: pMesh, r: d.r, speed: d.speed, ang: Math.random() * 6.28 });
      }
    }

    // -------------------------------------------------------------------------
    // APP 7: VR180 / 360 VIDEO SPHERE (Port of VideoSphere.cs)
    // -------------------------------------------------------------------------
    const demoVideoEl = document.getElementById("demo-video");
    {
      const vidTex = new THREE.VideoTexture(demoVideoEl);
      vidTex.minFilter = THREE.LinearFilter;
      vidTex.magFilter = THREE.LinearFilter;
      const sphereGeo = new THREE.SphereGeometry(8.0, 48, 32);
      sphereGeo.scale(-1, 1, 1); // Invert normals to view from inside
      const sphereMat = new THREE.MeshBasicMaterial({ map: vidTex });
      const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
      appGroups[7].add(sphereMesh);
    }

    // =========================================================================
    // 5. MATERIAL 3 IN-AIR SPATIAL UI & PINCH ROUTER (M3Toolbar.cs + AppLibrary.cs)
    // =========================================================================
    const uiState = {
      currentMode: 4, // Start on 3D Cube Sandbox so user can immediately test smooth 3D Cube!
      stereoVrMode: false,
      vrLensOptics: true, // Cardboard/Shinecon 48x48 Barrel Distortion + R/G/B Chromatic Pre-Correction
      handOcclusion: true,
      isMenuOpen: true,
      isLibraryOpen: false,
      useWebcamFallback: false,
      flipH: false,
      flipV: false,
      rot180: false,
      ipdOffset: 14,
      activeRoute: null,
      wasPinched: false,
      lastClickAt: 0,
      aimHistory: new AimHistory(0.045),
      smoothCursor: { x: 640, y: 360 },
      hoveredBtnId: null,
      buttons: [],

      buildButtons(viewW, viewH) {
        const sy = viewH / 720.0;
        const panelX0 = viewW >= 800 ? Math.floor((viewW - 592) / 2) : Math.floor((viewW - 592) / 2);
        const btns = [];

        if (this.isMenuOpen) {
          // Top Safe-Zone M3 Toolbar (nam o tren cung y=72..112 de nhường toan bo khong gian duoi cho tay & 3D!)
          const yTb = Math.floor(72 * sy);
          const hTb = Math.max(30, Math.floor(38 * sy));
          const tbDefs = [
            { id: "tb_apps", label: "[+] APPS", x: 30, w: 100, active: this.isLibraryOpen },
            { id: "tb_view", label: this.stereoVrMode ? "[0] SBS VR" : "[0] 1-SCR", x: 138, w: 108, active: this.stereoVrMode },
            { id: "tb_recenter", label: "[*] RESET", x: 254, w: 98, active: false },
            { id: "tb_cam", label: this.useWebcamFallback ? "[-] LAPTOP" : "[-] IPHONE", x: 360, w: 104, active: false },
            { id: "tb_hide", label: "[X] HIDE", x: 472, w: 90, active: false }
          ];
          for (const d of tbDefs) {
            btns.push({ id: d.id, label: d.label, x: panelX0 + d.x, y: yTb, w: d.w, h: hTb, r: 19, active: d.active });
          }

          if (this.isLibraryOpen) {
            // 2x4 App Library Grid ngay ben duoi thanh cong cu tren (y=124..300)
            const tiles = [
              { id: "demo_1", label: "3D PAINT", sub: "Tilt Brush", col: "#d0bcff" },
              { id: "demo_2", label: "AR PORTAL", sub: "3D World", col: "#38bdf8" },
              { id: "demo_3", label: "ORB RUSH", sub: "Rhythm", col: "#4ade80" },
              { id: "demo_4", label: "3D CUBES", sub: "Physics", col: "#fb923c" },
              { id: "demo_5", label: "CALIPER", sub: "mm Ruler", col: "#22d3ee" },
              { id: "demo_6", label: "SPATIAL 3D", sub: "Solar Sim", col: "#f472b6" },
              { id: "demo_7", label: "VIDEO VR", sub: "180/360", col: "#a78bfa" },
              { id: "tb_recenter", label: "RECENTER", sub: "Reset 6DoF", col: "#94a3b8" }
            ];
            for (let i = 0; i < tiles.length; i++) {
              const row = Math.floor(i / 4), col = i % 4;
              const tx = panelX0 + 30 + col * 136;
              const ty = Math.floor((124 + row * 90) * sy);
              const modeNum = i < 7 ? i + 1 : -1;
              btns.push({
                id: tiles[i].id, label: tiles[i].label, sub: tiles[i].sub, accent: tiles[i].col,
                x: tx, y: ty, w: 126, h: Math.floor(80 * sy), r: 18,
                active: this.currentMode === modeNum
              });
            }
          } else if (this.currentMode === 1) {
            const ySub = Math.floor(122 * sy);
            const cols = ["#d0bcff", "#00f3ff", "#22c55e", "#f97316", "#ffffff"];
            for (let i = 0; i < 5; i++) {
              btns.push({
                id: `col_${i}`, label: "", accent: cols[i],
                x: panelX0 + 40 + i * 52, y: ySub, w: 40, h: 40, r: 20,
                active: paintState.colorIdx === i
              });
            }
            btns.push({ id: "paint_undo", label: "UNDO", x: panelX0 + 315, y: ySub, w: 80, h: 40, r: 16 });
            btns.push({ id: "paint_clear", label: "CLEAR", x: panelX0 + 405, y: ySub, w: 84, h: 40, r: 16 });
          }
        }
        this.buttons = btns;
        return btns;
      },

      switchMode(m) {
        this.currentMode = m;
        for (let i = 1; i <= 7; i++) appGroups[i].visible = (i === m);
        if (m === 7) demoVideoEl.play().catch(() => {});
        else demoVideoEl.pause();
      },

      dispatchClick(id, tracker6dof) {
        if (id === "tb_apps") this.isLibraryOpen = !this.isLibraryOpen;
        else if (id === "tb_view") this.stereoVrMode = !this.stereoVrMode;
        else if (id === "tb_recenter") {
          tracker6dof.reset();
          cubeState.resetToFront(camera);
        } else if (id === "tb_cam") {
          this.useWebcamFallback = !this.useWebcamFallback;
          if (this.useWebcamFallback) initLocalWebcam();
        } else if (id === "tb_hide") {
          this.isMenuOpen = false;
          this.isLibraryOpen = false;
        } else if (id.startsWith("demo_")) {
          const m = parseInt(id.split("_")[1], 10);
          this.switchMode(m);
          this.isLibraryOpen = false;
        } else if (id.startsWith("col_")) {
          paintState.colorIdx = parseInt(id.split("_")[1], 10);

    // =========================================================================

    function splitAnnexBNalus(buf) {
      const nalus = [];
      let i = 0;
      const n = buf.length;
      let start = -1;
      while (i < n - 3) {
        if (buf[i] === 0 && buf[i + 1] === 0 && (buf[i + 2] === 1 || (buf[i + 2] === 0 && buf[i + 3] === 1))) {
          const scLen = buf[i + 2] === 1 ? 3 : 4;
          if (start !== -1) nalus.push(buf.subarray(start, i));
          start = i;
          i += scLen;
        } else {
          i++;
        }
      }
      if (start !== -1) nalus.push(buf.subarray(start));
      else if (n > 0) nalus.push(buf);
      return nalus;
    }

    function getNalType(nalu) {
      const offset = (nalu[0] === 0 && nalu[1] === 0 && nalu[2] === 1) ? 3 : 4;
      return nalu[offset] & 0x1f;
    }

    function feedH264AccessUnit(rawBytes) {
      if (!h264Decoder) return;
      const nalus = splitAnnexBNalus(rawBytes);
      let isKey = false;
      let hasSlice = false;

      for (const nalu of nalus) {
        const t = getNalType(nalu);
        if (t === 7) cachedSPS = nalu;
        else if (t === 8) cachedPPS = nalu;
        else if (t === 5) { isKey = true; hasSlice = true; }
        else if (t === 1) { hasSlice = true; }
      }

      if (!decoderConfigured && cachedSPS && cachedPPS) {
        try {
          // Extract profile/constraints/level from SPS bytes after header
          const off = (cachedSPS[0] === 0 && cachedSPS[1] === 0 && cachedSPS[2] === 1) ? 4 : 5;
          const p = cachedSPS[off].toString(16).padStart(2, "0");
          const c = cachedSPS[off + 1].toString(16).padStart(2, "0");
          const l = cachedSPS[off + 2].toString(16).padStart(2, "0");
          h264Decoder.configure({
            codec: `avc1.${p}${c}${l}`,
            optimizeForLatency: true,
            hardwareAcceleration: "prefer-hardware"
          });
          decoderConfigured = true;
        } catch {
          h264Decoder.configure({
            codec: "avc1.64002a",
            optimizeForLatency: true,
            hardwareAcceleration: "prefer-hardware"
          });
          decoderConfigured = true;
        }
      }

      if (!decoderConfigured || !hasSlice) return;

      let chunkData = rawBytes;
      if (isKey && cachedSPS && cachedPPS) {
        const merged = new Uint8Array(cachedSPS.length + cachedPPS.length + rawBytes.length);
        merged.set(cachedSPS, 0);
        merged.set(cachedPPS, cachedSPS.length);
        merged.set(rawBytes, cachedSPS.length + cachedPPS.length);
        chunkData = merged;
      }

      try {
        if (h264Decoder.decodeQueueSize < 3) {
          h264Decoder.decode(new EncodedVideoChunk({
            type: isKey ? "key" : "delta",
            timestamp: performance.now() * 1000,
            data: chunkData
          }));
        }
      } catch {
        // Wait for next keyframe
      }
    }

    // Connect Binary WebSocket to Native Node.js USB Server + Hardware NVENC H.264 / Crisp JPEG Encoder

    let activeH264Codec = null;

    async function configureReturnH264(bitrate) {
      if (typeof VideoEncoder === "undefined") return;
      try {
        const candidates = [
          { codec: "avc1.4d001f", hardwareAcceleration: "prefer-hardware" },
          { codec: "avc1.42001f", hardwareAcceleration: "prefer-hardware" },
          { codec: "avc1.64001f", hardwareAcceleration: "prefer-hardware" },
          { codec: "avc1.42001f", hardwareAcceleration: "no-preference" }
        ];
        let chosen = null;
        for (const cand of candidates) {
          const cfg = {
            codec: cand.codec,
            width: W,
            height: H,
            bitrate,
            framerate: 60,
            latencyMode: "realtime",
            hardwareAcceleration: cand.hardwareAcceleration,
            avc: { format: "annexb" }
          };
          const sup = await VideoEncoder.isConfigSupported(cfg);
          if (sup && sup.supported) {
            chosen = cfg;
            break;
          }
        }
        if (!chosen) return;
        if (!returnH264Encoder || returnH264Encoder.state === "closed") {
          returnH264Encoder = new VideoEncoder({
            output: (chunk) => {
              if (!ws || ws.readyState !== 1 || !usbConnected) return;
              const pkt = new Uint8Array(1 + chunk.byteLength);
              pkt[0] = 0x06;
              chunk.copyTo(pkt.subarray(1));
              usbWireAckReady = false;
              lastSendAt = performance.now();
              ws.send(pkt.buffer);
              phoneFramesCount++;
              const dtFps = lastSendAt - lastPhoneFpsTick;
              if (dtFps >= 1000) {
                phoneFps = Math.round((phoneFramesCount * 1000) / dtFps);
                phoneFramesCount = 0;
                lastPhoneFpsTick = lastSendAt;
              }
            },
            error: (err) => {
              console.warn("[NVENC Return] Encoder reset:", err);
              h264EncoderReady = false;
              setTimeout(() => configureReturnH264(usbQualityMode === 1 ? 22_000_000 : 15_000_000), 400);
            }
          });
        }
        returnH264Encoder.configure(chosen);
        activeH264Codec = chosen.codec;
        h264EncoderReady = true;
        forceNextH264Keyframe = true;
        console.log("[NVENC Return] H.264 60FPS Ready:", chosen.codec, bitrate / 1_000_000, "Mbps");
      } catch (e) {
        console.warn("[NVENC Return] Unavailable, using JPEG fallback:", e);
        h264EncoderReady = false;
      }
    }

      encoderBusy = false;

        const sendViaJpegOnly = !usbConnected || !h264EncoderReady || usbQualityMode >= 2;
        if (sendViaJpegOnly) {
          usbWireAckReady = false;
          lastSendAt = performance.now();
          phoneFramesCount++;
          const dtFps = lastSendAt - lastPhoneFpsTick;

    if (typeof OffscreenCanvas !== "undefined" && typeof createImageBitmap === "function") {

            const { bitmap, w, h, quality } = e.data;

              const ab = await blob.arrayBuffer();

    function connectWebSocket() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}`);

            usbFps = msg.fps || 0;
            mirrorConnected = Boolean(msg.mirrorConnected || (msg.mirrorClients || 0) > 0);

    let lastTime = performance.now();

    function unprojectScreenToWorld(px, py, viewW, viewH, depthM, cam) {
      const ndcX = (px / viewW) * 2.0 - 1.0;

      const halfH = Math.tan(THREE.MathUtils.degToRad(cam.fov * 0.5)) * depthM;
      const halfW = halfH * (viewW / viewH);
      const localPt = new THREE.Vector3(ndcX * halfW, ndcY * halfH, -depthM);

    function animate(nowMs) {

      lastTime = nowMs;
      const nowSec = nowMs / 1000.0;
      smoothFps = 0.92 * smoothFps + 0.08 * (1.0 / dt);

      // 1. Select Active Camera Feed (iPhone USB H.264 NVDEC vs Local Webcam)
      const useUsb = usbConnected && hasUsbFrame && !uiState.useWebcamFallback;
      const activeVideoSource = useUsb ? videoCanvas : (webcamReady ? webcamEl : null);

      if (activeVideoSource && !useUsb) {
        videoCtx.save();
        if (uiState.flipH) {
          videoCtx.translate(W, 0);
          videoCtx.scale(-1, 1);
        }
        videoCtx.drawImage(activeVideoSource, 0, 0, W, H);
        videoCtx.restore();
      }

      // 2. Run MediaPipe GPU Hand Landmarker on current video frame
      let lms2d = null;
      let lms3dWorld = null;
      let isPinched = false;
      let pinchPt2d = null;
      let pinchPtWorld = null;
      let fingerAngle = null;

      const viewW = uiState.stereoVrMode ? 640 : W;
      const viewH = H;
      const cropW = uiState.stereoVrMode ? Math.floor(H * (640 / 720)) : W;
      const origX1 = uiState.stereoVrMode ? Math.floor((W - cropW) / 2) : 0;
      const sxActive = viewW / cropW;
      const syActive = viewH / H;

      if (tracker6dof.hasHardwarePose && !tracker6dof.firstHardwareAnchored) {
        tracker6dof.firstHardwareAnchored = true;
        tracker6dof.reset();
        camera.aspect = viewW / viewH;
        camera.updateProjectionMatrix();
        tracker6dof.applyToCamera(camera, false);
        cubeState.resetToFront(camera);
      }

      if (uiState.useWebcamFallback && !webcamReady && !webcamStartRequested) {
        initLocalWebcam();
      }

      const curFrameKey = useUsb
        ? `u_${videoFrameSeq}`
        : `w_${(webcamEl && webcamEl.currentTime ? webcamEl.currentTime : 0).toFixed(4)}`;
      if ((useUsb || webcamReady) && curFrameKey !== lastUploadedTexSeq) {
        lastUploadedTexSeq = curFrameKey;
        videoBgTex.needsUpdate = true;
      }

      if (handLandmarker && (useUsb || webcamReady)) {
        try {
          const curInputSeq = curFrameKey;
          let res = cachedHandResult;
          if (curInputSeq !== lastAiFrameSeq || (nowMs - lastAiRunMs) > 80) {
            lastAiFrameSeq = curInputSeq;
            lastAiRunMs = nowMs;
            aiCtx.drawImage(videoCanvas, 0, 0, AI_W, AI_H);
            const mpTs = nowMs > lastMpTs ? nowMs : lastMpTs + 1;
            lastMpTs = mpTs;
            res = handLandmarker.detectForVideo(aiCanvas, mpTs);
            cachedHandResult = res;
          }
          if (res && res.landmarks && res.landmarks.length > 0) {
            const rawLms = res.landmarks[0];
            const worldLms = res.worldLandmarks && res.worldLandmarks.length > 0 ? res.worldLandmarks[0] : null;
            lms2d = [];
            for (let i = 0; i < 21; i++) {
              lms2d.push({
                x: filters2D[i].x.filter(nowSec, rawLms[i].x * W),
                y: filters2D[i].y.filter(nowSec, rawLms[i].y * H),
                z: rawLms[i].z || 0
              });
            }

            // Update 6DoF Camera Pose BEFORE unprojecting 3D hand joints!
            tracker6dof.updateFromVideo(videoCanvas, lms2d, W, H, dt);
            camera.aspect = viewW / viewH;
            camera.updateProjectionMatrix();
            tracker6dof.applyToCamera(camera, uiState.stereoVrMode);

            // Compute Monocular Hand Depth from knuckle width
            const d2 = (a, b) => Math.hypot((lms2d[a].x - lms2d[b].x) * sxActive, (lms2d[a].y - lms2d[b].y) * syActive);
            const knucklePx = 0.5 * (d2(5, 9) + d2(9, 13));
            const palmPx = Math.max(knucklePx * 3.2, d2(0, 9), 24.0);
            const focalPx = (viewW * 0.5) / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
            const baseZ = Math.max(0.32, Math.min(1.25, (0.085 * focalPx) / palmPx));

            lms3dWorld = [];
            for (let i = 0; i < 21; i++) {
              const vx = (lms2d[i].x - origX1) * sxActive;
              const vy = lms2d[i].y * syActive;
              const rawW = unprojectScreenToWorld(vx, vy, viewW, viewH, baseZ + lms2d[i].z * 0.45, camera);
              lms3dWorld.push(filters3D[i].filter(nowSec, rawW));
            }

            isPinched = pinchDetector.update(lms2d, worldLms, nowSec);
            // Index-anchored weighted pinch cursor avoids downward aiming jump right before pinching!
            const wIdx = isPinched ? 0.58 : 0.78;
            const wThumb = 1.0 - wIdx;
            pinchPtWorld = lms3dWorld[8].clone().multiplyScalar(wIdx).addScaledVector(lms3dWorld[4], wThumb);
            const px2dRaw = lms2d[8].x * wIdx + lms2d[4].x * wThumb;
            const py2dRaw = lms2d[8].y * wIdx + lms2d[4].y * wThumb;
            pinchPt2d = {
              x: (px2dRaw - origX1) * sxActive,
              y: py2dRaw * syActive
            };
            fingerAngle = Math.atan2(lms2d[8].y - lms2d[4].y, lms2d[8].x - lms2d[4].x);
            lastValidPinchWorld = pinchPtWorld;
            lastValidFingerAngle = fingerAngle;

            // Open Palm Gesture at top-left to re-open hidden menu
            if (!uiState.isMenuOpen && lms2d[8].y < lms2d[6].y && lms2d[12].y < lms2d[10].y && isPinched) {
              uiState.isMenuOpen = true;
            }
          } else {
            tracker6dof.updateFromVideo(videoCanvas, null, W, H, dt);
            camera.aspect = viewW / viewH;
            camera.updateProjectionMatrix();
            tracker6dof.applyToCamera(camera, uiState.stereoVrMode);

            if (pinchDetector.holdOnHandLost(nowSec) && lastValidPinchWorld) {
              isPinched = true;
              pinchPtWorld = lastValidPinchWorld;
              fingerAngle = lastValidFingerAngle;
            }
          }
        } catch {
          // Continue smoothly
        }
      } else {
        tracker6dof.updateFromVideo(videoCanvas, null, W, H, dt);
        camera.aspect = viewW / viewH;
        camera.updateProjectionMatrix();
        tracker6dof.applyToCamera(camera, uiState.stereoVrMode);
      }

      // 3. Route Pinch via CardboardXR PinchRouter
      const consumedByUI = uiState.updateRouter(pinchPt2d, isPinched, nowSec, tracker6dof, viewW, viewH);

      // 4. Update Active 3D Spatial Demo
      const mode = uiState.currentMode;
      if (mode === 1) {
        if (pinchPtWorld) {
          paintState.cursorBall.visible = true;
          paintState.cursorBall.position.copy(pinchPtWorld);
        } else {
          paintState.cursorBall.visible = false;
        }
        if (!consumedByUI && isPinched && pinchPtWorld) {
          paintState.addPoint(pinchPtWorld);
        } else {
          paintState.finishStroke();
        }
      } else if (mode === 2) {
        portalState.rings.forEach((r, idx) => {
          r.rotation.z = nowSec * (idx % 2 === 0 ? 1.2 : -1.2);
        });
        if (portalState.coreCrystal) {
          portalState.coreCrystal.rotation.y += dt * 1.4;
          portalState.coreCrystal.rotation.x += dt * 0.9;
        }
      } else if (mode === 3) {
        rushState.update(nowSec, dt, pinchPtWorld || (lms3dWorld ? lms3dWorld[8] : null));
      } else if (mode === 4) {
        if (!consumedByUI) {
          cubeState.update(dt, isPinched, pinchPtWorld, camera, fingerAngle, tracker6dof);
        }
      } else if (mode === 5 && lms3dWorld) {
        caliperState.jawA.position.copy(lms3dWorld[4]);
        caliperState.jawB.position.copy(lms3dWorld[8]);
        caliperState.line.geometry.setFromPoints([lms3dWorld[4], lms3dWorld[8]]);
        caliperState.distMm = lms3dWorld[4].distanceTo(lms3dWorld[8]) * 1000.0;
      } else if (mode === 6) {
        for (const p of solarState.planets) {
          p.ang += p.speed * dt * solarState.speedMult;
          p.mesh.position.set(Math.cos(p.ang) * p.r, 0, Math.sin(p.ang) * p.r);
        }
        if (!consumedByUI && isPinched && pinchPtWorld) {
          solarState.root.rotation.y += dt * 1.8;
        }
      }

      // Update Depth-Only 21-Joint Hand Occluder + 3D Pinch Reticle
      handOccluderState.update(
        lms3dWorld,
        pinchPtWorld,
        isPinched,
        camera,
        uiState.handOcclusion,
        mode === 4 && cubeState.isGrabbed
      );

      // 5. Render Single-Pass WebGL2 CAS Video + Depth Hand Occluder + PBR 3D + VR Optics Compositor
      if (!uiState.stereoVrMode) {
        // 1-SCR: GPU CAS Sharpened Video + Depth-Only Hand Occlusion + PBR 3D Apps -> compCanvas
        renderer.setRenderTarget(null);
        renderer.setViewport(0, 0, W, H);
        renderer.setScissorTest(false);
        renderer.clear();
        bgMat.uniforms.uCrop.value.set(0, 0, 1, 1);
        renderer.render(bgScene, bgCamera);
        renderer.clearDepth();
        renderer.clearStencil();
        renderer.render(scene, camera);

        compCtx.drawImage(glCanvas, 0, 0, W, H);
        uiState.drawGlassUI(compCtx, 0, isPinched, !!pinchPt2d);
      } else {
        // SBS VR: Render Dual-Eye (CAS Video + Stereo IPD 3D + HUD Texture) -> Offscreen Target -> 48x48 Barrel & RGB Optics Pass
        const eyeW = 640, eyeH = 720;
        const x1L = Math.max(0, Math.min(W - cropW, origX1 - uiState.ipdOffset));
        const x1R = Math.max(0, Math.min(W - cropW, origX1 + uiState.ipdOffset));

        uiLayerCtx.clearRect(0, 0, eyeW, eyeH);
        uiState.drawGlassUI(uiLayerCtx, 0, isPinched, !!pinchPt2d);
        uiLayerTex.needsUpdate = true;

        const basePos = camera.position.clone();
        const rightVec = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);

        renderer.setRenderTarget(stereoTarget);
        renderer.setScissorTest(true);

        // Left Eye (-32mm IPD shift)
        renderer.setViewport(0, 0, eyeW, eyeH);
        renderer.setScissor(0, 0, eyeW, eyeH);
        renderer.clear();
        bgMat.uniforms.uCrop.value.set(x1L / W, 0, cropW / W, 1);
        renderer.render(bgScene, bgCamera);
        renderer.clearDepth();
        renderer.clearStencil();
        camera.position.copy(basePos).addScaledVector(rightVec, -0.032);
        camera.updateMatrixWorld();
        renderer.render(scene, camera);
        renderer.render(uiOverlayScene, bgCamera);

        // Right Eye (+32mm IPD shift)
        renderer.setViewport(eyeW, 0, eyeW, eyeH);
        renderer.setScissor(eyeW, 0, eyeW, eyeH);
        renderer.clear();
        bgMat.uniforms.uCrop.value.set(x1R / W, 0, cropW / W, 1);
        renderer.render(bgScene, bgCamera);
        renderer.clearDepth();
        renderer.clearStencil();
        camera.position.copy(basePos).addScaledVector(rightVec, +0.032);
        camera.updateMatrixWorld();
        renderer.render(scene, camera);
        renderer.render(uiOverlayScene, bgCamera);

        camera.position.copy(basePos);
        camera.updateMatrixWorld();

        // Final Compositor Optics Pass (Vertex Barrel Distortion + R/G/B Chromatic + Hidden Area Mask)
        renderer.setRenderTarget(null);
        renderer.setScissorTest(false);
        renderer.setViewport(0, 0, W, H);
        renderer.clear();
        renderer.render(uiState.vrLensOptics ? vrOpticsScene : vrFlatScene, bgCamera);

        compCtx.drawImage(glCanvas, 0, 0, W, H);
        compCtx.fillStyle = "#000000";
        compCtx.fillRect(eyeW - 2, 0, 4, eyeH);
      }

      // 6. Stream Rendered Composite Frame back to iPhone:
      //    - USB Native App: RTX 4060 NVENC Hardware H.264 (0x06) @ 60 FPS Crisp 720p (Zero JPEG Blur!)
      //    - Safari /phone Mirror or Fallback: High-Quality 1280x720 Worker JPEG (0x03)
      const hasPhoneTarget = usbConnected || mirrorConnected;
      const useH264Usb = usbConnected && h264EncoderReady && usbQualityMode <= 1;
      if (encoderBusy && nowMs - encodeStartedAt > 300) {
        encoderBusy = false;
      }
      const wireReady = usbConnected
        ? (usbWireAckReady || (nowMs - lastSendAt > 32))
        : (ws && ws.bufferedAmount < 131072 && (nowMs - lastSendAt >= 15));

      if (useH264Usb && ws && ws.readyState === 1 && returnH264Encoder && returnH264Encoder.state === "configured") {
        if (returnH264Encoder.encodeQueueSize < 2 && wireReady && ws.bufferedAmount < 262144 && (nowMs - lastH264SubmitAt >= 13.5)) {
          lastH264SubmitAt = nowMs;
          try {
            const vf = new VideoFrame(compCanvas, { timestamp: Math.round(nowMs * 1000) });
            const keyFrame = forceNextH264Keyframe || (h264FrameIdx % 60 === 0);
            forceNextH264Keyframe = false;
            h264FrameIdx++;
            returnH264Encoder.encode(vf, { keyFrame });
            vf.close();
          } catch (e) {
            h264EncoderReady = false;
          }
        }
      }

      const needJpegStream = mirrorConnected || (usbConnected && !useH264Usb);
      if (needJpegStream && ws && ws.readyState === 1 && !encoderBusy && (mirrorConnected || wireReady) && ws.bufferedAmount < 262144) {
        encoderBusy = true;
        encodeStartedAt = nowMs;

        let targetW = 1280;
        let targetH = 720;
        let targetQ = 0.84;
        if (usbQualityMode === 3 || usbRttMs > 28) {
          targetW = 960;
          targetH = 540;
          targetQ = 0.72;
        }

        if (jpegWorker && typeof createImageBitmap === "function") {
          createImageBitmap(compCanvas)
            .then((bitmap) => {
              jpegWorker.postMessage({ bitmap, w: targetW, h: targetH, quality: targetQ }, [bitmap]);
            })
            .catch(() => {
              encoderBusy = false;
            });
        } else {
          if (returnEncodeCanvas.width !== targetW || returnEncodeCanvas.height !== targetH) {
            returnEncodeCanvas.width = targetW;
            returnEncodeCanvas.height = targetH;
          }
          returnEncodeCtx.drawImage(compCanvas, 0, 0, targetW, targetH);
          returnEncodeCanvas.toBlob(
            (blob) => {
              if (blob && ws && ws.readyState === 1) {
                blob.arrayBuffer().then((ab) => {
                  const pkt = new Uint8Array(1 + ab.byteLength);
                  pkt[0] = 0x03;
                  pkt.set(new Uint8Array(ab), 1);
                  onReturnPacketEncoded(pkt.buffer);
                }).catch(() => { encoderBusy = false; });
              } else {
                encoderBusy = false;
              }
            },
            "image/jpeg",
            targetQ
          );
        }
      }

      // Update Top Status Pill
      const srcLabel = useUsb ? `IPHONE USB (${usbFps} FPS)` : "WEBCAM / SAFARI";
      const viewLabel = uiState.stereoVrMode ? "SBS VR" : "1-SCR";
      const qLabel = useH264Usb
        ? (usbQualityMode === 1 ? "H264 720p ULTRA" : "H264 720p")
        : (usbQualityMode === 3 || usbRttMs > 28 ? "JPEG 540p" : "JPEG 720p");
      const phoneLabel = hasPhoneTarget
        ? ` | PHONE: ${phoneFps || 0} FPS (${Math.round(usbRttMs)}ms ${qLabel})`
        : "";
      document.getElementById("status-text").textContent =
        `${viewLabel} | ${srcLabel} | RENDER: ${smoothFps.toFixed(0)} FPS${phoneLabel} | VFOV: ${camera.fov.toFixed(0)}°`;
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
