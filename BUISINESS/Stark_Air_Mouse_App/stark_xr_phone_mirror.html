<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <title>STARK XR // iPhone Fullscreen 60 FPS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      width: 100dvw; height: 100dvh;
      overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #view-canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      width: 100dvw; height: 100dvh;
      object-fit: cover;
      display: block;
    }
    #hud {
      position: fixed; top: env(safe-area-inset-top, 10px); left: 50%; transform: translateX(-50%);
      z-index: 20; background: rgba(10, 14, 22, 0.72);
      border: 1px solid rgba(0, 243, 255, 0.35);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 6px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 700; color: #00f3ff;
      transition: opacity 0.3s ease;
    }
    #start-gate {
      position: fixed; inset: 0; z-index: 50;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; text-align: center;
    }
    .btn {
      background: linear-gradient(135deg, #00f3ff, #2563eb);
      color: #000; border: none; border-radius: 999px;
      padding: 14px 30px; font-size: 15px; font-weight: 800;
      box-shadow: 0 0 24px rgba(0, 243, 255, 0.45);
    }
    .hint { font-size: 12px; color: #94a3b8; max-width: 360px; line-height: 1.45; }
  </style>
</head>
<body>
  <canvas id="view-canvas" width="960" height="540"></canvas>
  <div id="hud">STARK XR // CONNECTING...</div>

  <div id="start-gate">
    <div style="font-size: 20px; font-weight: 800; color: #00f3ff;">STARK XR // FULLSCREEN 60 FPS</div>
    <div class="hint">
      Hien thi Full man hinh 19.5:9 khong vien den, dong bo 60 FPS truc tiep tu RTX 4060 Laptop.<br/>
      (Meo Safari: Bam <b>Share -> Add to Home Screen</b> de an thanh dia chi 100%!)
    </div>
    <button class="btn" id="btn-go">MO FULL MAN HINH 60 FPS</button>
  </div>

  <script>
    const canvas = document.getElementById("view-canvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const hud = document.getElementById("hud");
    const gate = document.getElementById("start-gate");
    let ws = null;
    let frames = 0;
    let lastT = performance.now();
    let busy = false;
    let pendingBlob = null;

    async function renderBlob(blob) {
      if (busy) {
        pendingBlob = blob;
        return;
      }
      busy = true;
      let cur = blob;
      while (cur) {
        pendingBlob = null;
        try {
          const bmp = await createImageBitmap(cur);
          if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
            canvas.width = bmp.width;
            canvas.height = bmp.height;
          }
          ctx.drawImage(bmp, 0, 0);
          bmp.close();
          frames++;
          const now = performance.now();
          if (now - lastT >= 1000) {
            const fps = Math.round((frames * 1000) / (now - lastT));
            hud.textContent = `STARK XR FULLSCREEN | ${fps} FPS`;
            frames = 0;
            lastT = now;
          }
        } catch {}
        cur = pendingBlob;
      }
      busy = false;
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${location.host}`);
      ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: "role", role: "phone_mirror" }));
        hud.textContent = "DA KET NOI RTX 4060 GPU";
        setTimeout(() => { hud.style.opacity = "0"; }, 4000);
      };
      ws.onmessage = (ev) => {
        if (typeof ev.data === "string") return;
        const arr = new Uint8Array(ev.data);
        if (arr.length > 2 && arr[0] === 0x03) {
          const jpgBlob = new Blob([arr.subarray(1)], { type: "image/jpeg" });
          renderBlob(jpgBlob);
        }
      };
      ws.onclose = () => {
        hud.style.opacity = "1";
        hud.textContent = "MAT KET NOI - DANG THU LAI...";
        setTimeout(connect, 900);
      };
    }

    document.body.addEventListener("click", () => {
      hud.style.opacity = hud.style.opacity === "0" ? "1" : "0";
    });

    document.getElementById("btn-go").addEventListener("click", async (e) => {
      e.stopPropagation();
      gate.style.display = "none";
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        try {
          const p = await DeviceOrientationEvent.requestPermission();
          if (p === "granted") {
            window.addEventListener("deviceorientation", (ev) => {
              if (ws && ws.readyState === 1 && ev.alpha !== null) {
                ws.send(JSON.stringify({ type: "gyro", a: ev.alpha, b: ev.beta, g: ev.gamma }));
              }
            });
          }
        } catch {}
      }
      connect();
    });
  </script>
</body>
</html>
