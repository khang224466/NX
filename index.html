      <header>
        <h1>NX NEXORA - Nền Tảng Hỗ Trợ Hướng Nghiệp & Chiến Lược Tuyển Sinh Đại Học 2026</h1>
        <p>Hệ thống hướng nghiệp toàn diện kết nối chuỗi giá trị: Sở thích RIASEC &amp; Năng lực ➔ Ngành đào tạo cấp IV ➔ 219 Tổ hợp môn ➔ 300 Trường đại học ➔ Thị trường việc làm và phân vị lương P25–P90 theo mô hình ROOT-LOOP.</p>
      </header>
      <main>
        <section>
          <h2>01. Khám Phá Năng Lực &amp; Trắc Nghiệm Tâm Trắc Học Holland (RIASEC)</h2>
          <p>Bài trắc nghiệm 60 câu hỏi chuẩn hóa O*NET IPSF giúp định lượng 6 nhóm thiên hướng tính cách nghề nghiệp: Kỹ thuật (R), Nghiên cứu (I), Nghệ thuật (A), Xã hội (S), Quản lý (E), Nghiệp vụ (C). Kết quả trích xuất mã 3 chữ cái đại diện làm dữ liệu đầu vào chạy ma trận tương quan Pearson đối chiếu hơn 300 ngành đào tạo.</p>
        </section>
        <section>
          <h2>02. Danh Mục 219 Tổ Hợp Môn Xét Tuyển Đại Học Chuẩn Bộ GD&amp;ĐT</h2>
          <p>Tra cứu đầy đủ các tổ hợp truyền thống (A00, A01, B00, C00, D01) cùng các tổ hợp năng khiếu nghệ thuật, thể thao và báo chí (H00, H01, V00, V01, N00, M00, T00, R00, S00). Hệ thống tự động tính điểm trung bình môn, áp dụng công thức đặc thù từng trường và quy đổi điểm ưu tiên khu vực.</p>
        </section>
        <section>
          <h2>03. Cơ Sở Dữ Liệu 300 Trường Đại Học Toàn Quốc &amp; Điểm Chuẩn Tham Chiếu</h2>
          <p>Dữ liệu bao quát các trường đại học công lập, tư thục và quốc tế trên cả nước (ĐHQG Hà Nội, ĐHQG TP.HCM, ĐH Bách Khoa, ĐH Kinh Tế Quốc Dân, ĐH Y Dược...). Phân tầng trường theo 3 nhóm: Mơ ước (+1 đến +2 điểm), Vừa sức (&plusmn;0.75 điểm), An toàn (-1 đến -3 điểm).</p>
        </section>
        <section>
          <h2>04. Khung Trần Học Phí Nghị Định 238/2025/NĐ-CP &amp; Mức Lương Thị Trường</h2>
          <p>Cập nhật quy định trần học phí đại học mới nhất theo Nghị định 238/2025/NĐ-CP của Chính phủ, chính sách miễn giảm học phí cho ngành Sư phạm (Nghị định 116), cùng phân vị thu nhập khởi điểm và chỉ số rủi ro tự động hóa AI theo báo cáo Oxford Martin và McKinsey.</p>
